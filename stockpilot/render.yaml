services:
  - type: web
    name: stockpilot-inventory
    env: node
    plan: free
    buildCommand: npm install && npm run seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: saksham
      - key: ADMIN_PASSWORD
        value: "@12345"
      - key: ADMIN_FULL_NAME
        value: "Saksham"
      - key: ADMIN_EMAIL
        value: "saksham@stockpilot.local"

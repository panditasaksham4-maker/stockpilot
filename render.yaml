services:
  - type: web
    name: stockpilot-inventory
    env: node
    rootDir: stockpilot
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOST
        value: "0.0.0.0"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: saksham
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        value: saksham@stockpilot.local
      - key: ADMIN_FULL_NAME
        value: Saksham

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockPilot - Create Teammate Account</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">
  <div class="login-card" style="max-width: 440px;">
    <div class="login-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
      </div>
      <h1>Create Account</h1>
      <p>Register your credentials to access StockPilot</p>
    </div>

    <!-- Alert Box -->
    <div id="alertBox" style="display:none; padding:12px 16px; border-radius:var(--radius-md); font-size:0.85rem; margin-bottom:20px; border:1px solid transparent;"></div>

    <form id="registerForm">
      <div class="form-group">
        <label class="form-label" for="fullName">Full Name <span class="required">*</span></label>
        <input type="text" id="fullName" class="form-control" placeholder="Enter your full name" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="username">Username <span class="required">*</span></label>
        <input type="text" id="username" class="form-control" placeholder="Enter desired username" minlength="3" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address <span class="required">*</span></label>
        <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password <span class="required">*</span></label>
        <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px; font-size:1rem;">
        Register Account
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 0.88rem; color: var(--gray-400);">
      Already have an account? 
      <a href="/login.html" style="color: var(--primary-500); font-weight: 600; text-decoration: none; margin-left: 4px;">
        Sign In Here &rarr;
      </a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('registerForm');
      const submitBtn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('alertBox');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const fullName = document.getElementById('fullName').value.trim();
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!fullName) {
          showAlert('Please enter your full name.', 'error');
          return;
        }

        if (!username || username.length < 3) {
          showAlert('Username must be at least 3 characters long.', 'error');
          return;
        }

        if (!email || !email.includes('@')) {
          showAlert('Please enter a valid email address.', 'error');
          return;
        }

        if (password.length < 6) {
          showAlert('Password must be at least 6 characters long.', 'error');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Registering Account...';

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, fullName, email, password })
          });

          const data = await res.json();
          if (!res.ok) {
            showAlert(data.error || 'Registration failed.', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Register Account';
            return;
          }

          showAlert('Account registered successfully! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 800);
        } catch (err) {
          showAlert('Network or server connection error. Please try again.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Register Account';
        }
      });

      function showAlert(msg, type = 'error') {
        alertBox.textContent = msg;
        alertBox.style.display = 'block';
        if (type === 'success') {
          alertBox.style.backgroundColor = 'rgba(5, 150, 105, 0.2)';
          alertBox.style.borderColor = '#10B981';
          alertBox.style.color = '#A7F3D0';
        } else {
          alertBox.style.backgroundColor = 'rgba(220, 38, 38, 0.2)';
          alertBox.style.borderColor = '#EF4444';
          alertBox.style.color = '#FECACA';
        }
      }

      function hideAlert() {
        alertBox.style.display = 'none';
      }
    });
  </script>
</body>
</html>

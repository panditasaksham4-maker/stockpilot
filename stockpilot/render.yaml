services:
  - type: web
    name: stockpilot-inventory
    env: node
    plan: starter
    disk:
      name: stockpilot-data
      mountPath: /var/data
      sizeGB: 1
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOST
        value: "0.0.0.0"
      - key: DATABASE_PATH
        value: /var/data/stockpilot.sqlite
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_FULL_NAME
        value: "System Administrator"
